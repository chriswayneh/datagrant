[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "datagrant"
version = "0.0.1"
description = "Just-in-time, expiring, masked access to regulated data (PHI/PII) with signed access receipts"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=7", "ruff>=0.4", "mypy>=1.8"]

[project.scripts]
datagrant = "datagrant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
