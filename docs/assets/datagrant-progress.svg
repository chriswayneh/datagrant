<svg xmlns="http://www.w3.org/2000/svg" width="400" height="242" viewBox="0 0 400 242" role="img" aria-labelledby="title description">
  <title id="title">DataGrant v0.8.0</title>
  <desc id="description">Postgres, Snowflake, and BigQuery are supported. BigQuery passed mock tests and CI, with no live Google Cloud test. The PCI DSS support pack adds PAN masking and signed-receipt reports.</desc>
  <rect width="400" height="242" rx="12" fill="#eff5fa"/>
  <g fill="#fff" stroke="#526982">
    <rect x="18" y="18" width="364" height="108" rx="5"/>
    <rect x="18" y="139" width="364" height="84" rx="5" stroke-dasharray="6 4"/>
  </g>
  <g font-family="Verdana, sans-serif" fill="#15263a">
    <g font-size="20" font-weight="700">
      <text x="34" y="46">Supported engines</text>
      <text x="34" y="168">New in v0.8.0</text>
    </g>
    <g font-size="17">
      <text x="34" y="71">Postgres, Snowflake, BigQuery</text>
      <text x="34" y="94">BigQuery passed mock tests and CI.</text>
      <text x="34" y="115">No live Google Cloud test.</text>
      <text x="34" y="195">PCI DSS support pack</text>
    </g>
  </g>
</svg>
