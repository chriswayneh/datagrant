# Throwaway Postgres for `make demo`. Password comes from the environment at
# runtime (generated by scripts/demo.sh); nothing secret is committed.
name: datagrant-demo
services:
  postgres:
    image: postgres:19@sha256:bb6e70add742cd868fb62cb3b2f67d1dd2bdd2b65a521e778420748753687c60  # Postgres 18 demo; CI integration also covers 16
    environment:
      POSTGRES_PASSWORD: ${DATAGRANT_DEMO_PG_PASSWORD:?set by scripts/demo.sh}
    ports:
      - "127.0.0.1:${DATAGRANT_DEMO_PORT:-55439}:5432"   # localhost only
    volumes:
      # Postgres 18 uses PGDATA=/var/lib/postgresql/18/docker.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
