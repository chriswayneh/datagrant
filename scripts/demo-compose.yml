# Throwaway Postgres for `make demo`. Password comes from the environment at
# runtime (generated by scripts/demo.sh); nothing secret is committed.
name: datagrant-demo
services:
  postgres:
    image: postgres:16@sha256:5db6dac2ef5dcff512f4f00a009c3c332b9f2f28f24277175bf3e4a3d02ef83a  # postgres:16, pinned 2026-11-02 (same as CI)
    environment:
      POSTGRES_PASSWORD: ${DATAGRANT_DEMO_PG_PASSWORD:?set by scripts/demo.sh}
    ports:
      - "127.0.0.1:${DATAGRANT_DEMO_PORT:-55439}:5432"   # localhost only
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
