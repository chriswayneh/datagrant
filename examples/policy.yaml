# Example datagrant policy (local identity, the default). Fictional names only.
# For identity.mode: oidc see examples/policy-oidc.yaml and docs/demo-oidc.md.
version: 1
approval: auto            # auto | two-person (two-person also needs `approvers: [group]`)
max_duration: 8h          # policy-wide cap
groups:
  ml-team: [alice, bob]
  analysts: [carol]
datasets:
  - name: clinic
    database: clinicdb
    tables:
      - name: public.patients
        allowed_groups: [ml-team]
        max_duration: 4h
        columns:
          patient_id: hash
          birth_year: passthrough
          zip: partial
          diagnosis_code: passthrough
          full_name: redact
          region: passthrough     # row filters use columns or filter_columns
        row_filters:
          - "region = 'west'"
        require_row_filter: true
